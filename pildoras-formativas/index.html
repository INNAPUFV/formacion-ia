<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- No indexar en buscadores -->
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="bingbot" content="noindex, nofollow, noarchive, nosnippet">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Píldoras formativas · UFV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;600;700&family=Playfair+Display:wght@400;500;600;700&family=Roboto+Slab:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/ufv.css?v=202610011053">
<style>
[hidden]{display:none !important}
/* Tarjetas numeradas que abren el vídeo en ficha emergente */
.grid-pild{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px}
button.amb{font:inherit; text-align:left; cursor:pointer; width:100%}
button.amb:focus-visible{outline:3px solid var(--ufv-accent); outline-offset:2px}
.amb.soon{background:transparent; border-style:dashed; cursor:default}
.amb.soon:hover{transform:none; box-shadow:none; border-color:var(--line); background:transparent}
.amb.soon .amb-title{color:var(--muted)}
.amb-desc{margin:-6px 0 14px; font-size:.88rem; line-height:1.5; color:var(--muted)}
@media (max-width:560px){.grid-pild{grid-template-columns:1fr}}

/* Ficha emergente con el vídeo */
body.modal-open{overflow:hidden}
.modal{position:fixed; inset:0; z-index:100; display:none; align-items:flex-start; justify-content:center; padding:16px; background:rgba(0,26,51,.72); overflow:auto}
.modal.open{display:flex}
.modal-box{position:relative; width:min(820px,100%); margin:auto 0; border-radius:var(--radius); background:#fff; box-shadow:0 30px 80px rgba(0,0,0,.3); overflow:hidden}
.modal-head{display:flex; align-items:flex-start; gap:16px; padding:22px 70px 18px 26px; background:var(--ufv-secondary); color:#fff}
.modal-head .m-num{flex:none; font-family:var(--font-title); font-weight:600; font-size:1.9rem; line-height:1; padding-bottom:6px; border-bottom:3px solid var(--ufv-sky)}
.modal-head h2{margin:2px 0 0; font-family:var(--font-title); font-weight:500; font-size:1.45rem; line-height:1.2; color:#fff}
.modal-head p{margin:6px 0 0; color:var(--on-dark); font-size:.9rem; line-height:1.5}
.close-modal{position:absolute; top:12px; right:14px; width:38px; height:38px; border:1px solid rgba(255,255,255,.3); border-radius:50%; background:rgba(255,255,255,.08); color:#fff; font-size:1.2rem; line-height:1; cursor:pointer}
.close-modal:hover{background:rgba(255,255,255,.18)}
.modal-body{padding:20px 24px 22px}
.video-frame{position:relative; width:100%; aspect-ratio:16/9; border-radius:12px; overflow:hidden; background:var(--ufv-secondary)}
.video-frame iframe{position:absolute; inset:0; width:100%; height:100%; border:0}
.video-soon{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
  background:linear-gradient(135deg,rgba(0,26,51,.98),rgba(0,56,101,.9)); color:var(--on-dark); font-size:.9rem}
.video-soon .btn svg{width:16px; height:16px; padding:0; border:0; background:none; fill:none; stroke:currentColor; stroke-width:2}
.video-soon svg{width:50px; height:50px; padding:13px; border:1px solid rgba(255,255,255,.45); border-radius:50%; fill:var(--ufv-sky); background:rgba(255,255,255,.08)}
.modal-nav{display:flex; justify-content:space-between; gap:12px; margin-top:16px; padding-top:14px; border-top:1px solid var(--line)}
.modal-nav button{font:inherit; font-size:.88rem; font-weight:600; color:var(--ufv-primary); background:none; border:0; padding:6px 0; cursor:pointer; display:inline-flex; align-items:center; gap:7px}
.modal-nav button:hover{color:var(--ufv-sky)}
.modal-nav button:disabled{visibility:hidden}
.modal-nav svg{width:15px; height:15px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
</style>
</head>
<body>
<main>
  <section class="hero">
    <div class="container">
      <a class="back-link" href="#" data-enlace="volver" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg> Adopción de herramientas de Gemini</a>
      <p class="eyebrow">Formación</p>
      <h1>Píldoras formativas</h1>
      <p class="sub">Selección de casos de uso docente.</p>
    </div>
  </section>

  <section class="recursos">
    <div class="container">
      <p class="intro">Diez vídeos breves con casos de uso docente de la IA. Pulsa en cada píldora para verla.</p>
      <div class="grid-pild" id="pildoras"></div>
    </div>
  </section>
</main>

<div class="modal" id="modal-video" role="dialog" aria-modal="true" aria-labelledby="pv-title">
  <div class="modal-box">
    <button class="close-modal" type="button" aria-label="Cerrar">×</button>
    <div class="modal-head">
      <span class="m-num" id="pv-num" aria-hidden="true"></span>
      <div><h2 id="pv-title"></h2><p id="pv-desc"></p></div>
    </div>
    <div class="modal-body">
      <div class="video-frame" id="pv-video"></div>
      <div class="modal-nav">
        <button type="button" id="pv-prev"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg> Anterior</button>
        <button type="button" id="pv-next">Siguiente <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      </div>
    </div>
  </div>
</div>

<script>
/* ENLACES · las páginas de Canvas se abren en la ventana completa */
const ENLACES = {
  "volver": "https://ufv-es.instructure.com/courses/44179/pages/02-adopcion-de-herramientas-de-gemini"  // 02 Adopción de herramientas de Gemini
};
document.querySelectorAll('[data-enlace]').forEach(a => {
  const url = ENLACES[a.dataset.enlace];
  if (url) { a.href = url; a.target = "_top"; a.hidden = false; }
});

/* ============================================================
   PÍLDORAS · rellena cada una con sus datos.
   - titulo: si está vacío, la tarjeta aparece como «Próximamente».
   - descripcion: opcional, una línea bajo el título.
   - video: dirección (src) del iframe (Kaltura, Educamedia, YouTube…).
   - enlace: si el vídeo no se puede incrustar, enlace a su web (se abre en pestaña nueva).
   ============================================================ */
const PILDORAS = [
  { titulo:"Generación de vídeo para el aprendizaje con NotebookLM", descripcion:"", video:"https://www.youtube-nocookie.com/embed/xT7Zszd4cLs", enlace:"" },
  { titulo:"Generación de recursos con NotebookLM", descripcion:"Universidad de Sevilla", video:"https://tv.us.es/embed/secure/iframe/entryId/1_lhhiba6k/uiConfId/48213293/st/0", enlace:"https://tv.us.es/media/DOCENCIA+Y+APRENDIZAJE+CON+INTELIGENCIA+ARTIFICIAL:+NOTEBOOKLM+PARA+DOCENTES/1_lhhiba6k" },
  { titulo:"Uso de Canvas de Gemini y creación de Gems como asistente", descripcion:"Universidad de Sevilla", video:"https://tv.us.es/embed/secure/iframe/entryId/1_wvcg7o5p/uiConfId/48213293/pbc/216854503/st/0", enlace:"https://tv.us.es/media/DOCENCIA+Y+APRENDIZAJE+CON+INTELIGENCIA+ARTIFICIAL:+GEMINI+PARA+DOCENTES/1_wvcg7o5p/216854503" },
  { titulo:"Feedback con Gemini", descripcion:"", video:"https://www.youtube-nocookie.com/embed/3h3ubVn_UhQ", enlace:"" },
  { titulo:"Análisis crítico de los documentos para tus alumnos: «El criticador»", descripcion:"", video:"https://www.youtube-nocookie.com/embed/1XtgpdX-Ajs", enlace:"" },
  { titulo:"Detective de aprendizajes críticos en tus alumnos", descripcion:"", video:"https://www.youtube-nocookie.com/embed/iLNnDlbOD_Y", enlace:"" },
  { titulo:"Creación de casos actuales", descripcion:"", video:"https://www.youtube-nocookie.com/embed/WCMq3ioHUSY", enlace:"" },
  { titulo:"Creación de un simulador interactivo para alumnos", descripcion:"", video:"https://www.youtube-nocookie.com/embed/3-X5si3VuU0", enlace:"" },
  { titulo:"Pensamiento crítico en la revisión de materiales creados con IA", descripcion:"", video:"https://www.youtube-nocookie.com/embed/0el1ihz1GJo", enlace:"" },
  { titulo:"Tutor socrático", descripcion:"", video:"https://www.youtube-nocookie.com/embed/WfC2tna6kA4", enlace:"" }
];

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
const num = i => String(i + 1).padStart(2, '0');
const PLAY_ICO = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg>';
const LINK_ICO = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
const disponibles = PILDORAS.map((p, i) => p.titulo ? i : -1).filter(i => i >= 0);

const grid = document.getElementById('pildoras');
PILDORAS.forEach((p, i) => {
  if (!p.titulo) {
    grid.insertAdjacentHTML('beforeend', '<div class="amb soon"><span class="amb-head"><span class="amb-num" aria-hidden="true">' + num(i) + '</span><span class="amb-title">Próximamente</span></span></div>');
    return;
  }
  grid.insertAdjacentHTML('beforeend',
    '<button class="amb" type="button" data-p="' + i + '" aria-haspopup="dialog">' +
      '<span class="amb-head"><span class="amb-num" aria-hidden="true">' + num(i) + '</span><span class="amb-title">' + esc(p.titulo) + '</span></span>' +
      (p.descripcion ? '<span class="amb-desc">' + esc(p.descripcion) + '</span>' : '') +
      '<span class="amb-link">Ver vídeo ' + LINK_ICO + '</span>' +
    '</button>');
});

const modal = document.getElementById('modal-video');
let actual = -1, ultimo = null;
function mostrar(i) {
  const p = PILDORAS[i]; actual = i;
  document.getElementById('pv-num').textContent = num(i);
  document.getElementById('pv-title').textContent = p.titulo;
  document.getElementById('pv-desc').textContent = p.descripcion || '';
  document.getElementById('pv-desc').hidden = !p.descripcion;
  document.getElementById('pv-video').innerHTML = p.video
    ? '<iframe src="' + esc(p.video) + '" title="' + esc(p.titulo) + '" allowfullscreen webkitallowfullscreen mozallowfullscreen allow="autoplay *; fullscreen *; encrypted-media *; picture-in-picture" referrerpolicy="no-referrer-when-downgrade"></iframe>'
    : p.enlace
      ? '<div class="video-soon">' + PLAY_ICO + '<span>Este vídeo se reproduce en la web ' + (p.descripcion ? 'de la ' + esc(p.descripcion) : 'de origen') + '</span><a class="btn accent" href="' + esc(p.enlace) + '" target="_blank" rel="noopener">Ver el vídeo ' + LINK_ICO + '</a></div>'
      : '<div class="video-soon">' + PLAY_ICO + '<span>Vídeo próximamente</span></div>';
  const k = disponibles.indexOf(i);
  document.getElementById('pv-prev').disabled = k <= 0;
  document.getElementById('pv-next').disabled = k < 0 || k >= disponibles.length - 1;
}
function abrir(i) { ultimo = document.activeElement; mostrar(i); modal.classList.add('open'); document.body.classList.add('modal-open'); modal.querySelector('.close-modal').focus(); }
function cerrar() { modal.classList.remove('open'); document.body.classList.remove('modal-open'); document.getElementById('pv-video').innerHTML = ''; if (ultimo) ultimo.focus(); }
grid.addEventListener('click', e => { const b = e.target.closest('[data-p]'); if (b) abrir(+b.dataset.p); });
document.getElementById('pv-prev').addEventListener('click', () => mostrar(disponibles[disponibles.indexOf(actual) - 1]));
document.getElementById('pv-next').addEventListener('click', () => mostrar(disponibles[disponibles.indexOf(actual) + 1]));
modal.querySelector('.close-modal').addEventListener('click', cerrar);
modal.addEventListener('click', e => { if (e.target === modal) cerrar(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && modal.classList.contains('open')) cerrar(); });
</script>
</body>
</html>
