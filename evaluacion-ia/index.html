<script>
/* ENLACES
   Pega aquí la URL de cada recurso. Las páginas de Canvas se abren en la
   ventana completa (target="_top"); los enlaces externos, en una pestaña nueva.
   Mientras una URL esté vacía, su tarjeta no navega ("Próximamente"). */
const ENLACES = {
  "inicio": ""  // Volver al Espacio de Formación (portada en Canvas)
};
document.querySelectorAll('[data-enlace]').forEach(a => {
  const url = ENLACES[a.dataset.enlace];
  if (url) {
    a.href = url;
    a.target = /instructure\.com/.test(url) ? "_top" : "_blank";
    a.rel = "noopener";
    a.hidden = false;
  } else {
    a.addEventListener('click', e => e.preventDefault());
    a.setAttribute('aria-disabled', 'true');
    const l = a.querySelector('.rec-link');
    if (l) l.textContent = 'Próximamente';
  }
});
</script>
